<title>KLZ Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500&family=Manrope:wght@700;800&display=swap">
<style>
/* Layout: editor de 3 colunas (camadas | preview | propriedades) com timeline embaixo; empilha no celular.
   Visual: ilha escura de edição, destaque âmbar igual ao das legendas. Um único visual escuro por escolha. */
:root{
  --bg:#0d0e12; --panel:#15171d; --panel2:#1c1f27; --line:#2a2e39; --fg:#e9ebf1; --dim:#8c92a4; --accent:#ffb020; --accent-ink:#1b1300;
  --danger:#ff6b6b; --ok:#4cc38a;
  --c-video:#3d6fd9; --c-audio:#2fa070; --c-captions:#a45fd0; --c-glass:#5b84a8; --c-title:#e07a3c; --c-stat:#d4a02a; --c-floatingWords:#c15f8f; --c-flash:#8c92a4;
  --ui:'DM Sans',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.4 var(--ui);padding-inline:16px;padding-block:12px;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;min-height:34px}
button:hover{border-color:var(--dim)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
button.ghost{background:transparent}
button.danger{color:var(--danger)}
button:disabled{opacity:.45;cursor:default}
input[type=text],input[type=number],textarea,select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
textarea{resize:vertical;min-height:54px}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--bg);flex:none}
.app{height:100%;display:grid;grid-template-columns:230px minmax(0,1fr) 330px;grid-template-rows:auto minmax(0,1fr) 250px;grid-template-areas:"top top top" "layers view insp" "tl tl tl";gap:10px}
.top{grid-area:top;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.brand{font:800 18px var(--ui);letter-spacing:-.02em;margin-right:8px}
.brand b{color:var(--accent)}
.top .sp{flex:1}
.top select{width:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:0;min-width:0;overflow:auto}
.layers{grid-area:layers}.insp{grid-area:insp}
.ph{position:sticky;top:0;z-index:2;background:var(--panel);padding:10px 12px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;justify-content:space-between;gap:8px}
.view{grid-area:view;display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#050507;border:1px solid var(--line);border-radius:12px;padding:8px}
canvas#cv{height:100%;max-width:100%;aspect-ratio:9/16;background:#000;border-radius:6px}
.transport{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.tc{font:500 14px var(--mono);color:var(--accent);min-width:130px;text-align:center;font-variant-numeric:tabular-nums}
.lrow{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.lrow:hover{background:var(--panel2)}
.lrow.sel{background:var(--panel2);box-shadow:inset 3px 0 0 var(--accent)}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.lrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow small{color:var(--dim);font-family:var(--mono);font-size:11px}
.add{padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.add button{font-size:12.5px;padding:6px 8px}
.fld{padding:7px 12px;display:grid;gap:4px}
.fld label{color:var(--dim);font-size:12px;display:flex;justify-content:space-between;gap:8px}
.fld label output{font-family:var(--mono);color:var(--fg)}
.row2{display:flex;gap:6px;align-items:center}
.chk{display:flex;gap:8px;align-items:center;padding:7px 12px}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line)}
.hint{padding:8px 12px;color:var(--dim);font-size:12.5px}
.phr{padding:8px 12px;border-bottom:1px solid var(--line);display:grid;gap:4px}
.phr small{font-family:var(--mono);color:var(--dim);font-size:11px}
.zp{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px;padding:4px 12px;align-items:end}
.tl{grid-area:tl;display:flex;flex-direction:column;overflow:hidden}
.tlbar{display:flex;gap:10px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line);color:var(--dim);font-size:12px}
.tlbar input{width:140px}
.tlscroll{flex:1;overflow:auto;position:relative;min-height:0}
.tlin{position:relative;min-height:100%}
.ruler{height:22px;position:sticky;top:0;z-index:3;background:var(--panel);border-bottom:1px solid var(--line);margin-left:150px;cursor:pointer}
.ruler span{position:absolute;top:4px;font:500 10px var(--mono);color:var(--dim);border-left:1px solid var(--line);padding-left:3px;height:16px}
.trow{display:flex;height:30px;border-bottom:1px solid #1f222b}
.tname{width:150px;flex:none;position:sticky;left:0;z-index:2;background:var(--panel);padding:6px 10px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--line)}
.trow.sel .tname{color:var(--accent)}
.lane{position:relative;flex:1}
.clip{position:absolute;top:3px;height:24px;border-radius:5px;padding:4px 8px;font-size:11.5px;white-space:nowrap;overflow:hidden;cursor:grab;border:1px solid rgba(255,255,255,.14);color:#fff;user-select:none}
.clip.sel{border-color:#fff;box-shadow:0 0 0 1px #fff}
.clip .rz{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:ew-resize;background:rgba(255,255,255,.22)}
#ph{position:absolute;top:0;bottom:0;width:2px;background:#ff4d4d;z-index:4;pointer-events:none;margin-left:150px}
#ph::before{content:"";position:absolute;top:0;left:-5px;width:12px;height:10px;background:#ff4d4d;clip-path:polygon(0 0,100% 0,50% 100%)}
.overlay{position:fixed;inset:0;background:rgba(5,5,8,.8);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:420px;width:100%;display:grid;gap:12px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);width:0}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:9px 14px;border-radius:10px;z-index:60;max-width:calc(100% - 32px)}
.drop{border:1px dashed var(--line);border-radius:10px;padding:12px;margin:10px 12px;color:var(--dim);font-size:12.5px;text-align:center}
@media (max-width:980px){
  html,body{height:auto}body{overflow:auto}
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-template-areas:"top" "view" "tl" "layers" "insp"}
  .view{height:78vh}.tl{height:260px}.layers,.insp{max-height:60vh}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<div class="app">
  <div class="top">
    <span class="brand">KLZ <b>Editor</b></span>
    <button id="bVideo" class="primary">Abrir vídeo original</button>
    <input id="fVideo" type="file" accept="video/*" hidden>
    <span id="vstat" style="color:var(--dim);font-size:12.5px"></span>
    <span class="sp"></span>
    <button id="bOpen" class="ghost">Abrir projeto</button>
    <input id="fProj" type="file" accept="application/json,.json" hidden>
    <button id="bSave" class="ghost">Salvar projeto</button>
    <button id="bReset" class="ghost">Restaurar exemplo</button>
    <select id="selRes" title="Resolução do vídeo exportado"><option value="540">540×960</option><option value="720" selected>720×1280</option><option value="1080">1080×1920</option></select>
    <button id="bExport" class="primary">Exportar vídeo</button>
  </div>

  <section class="panel layers">
    <div class="ph"><span>Camadas</span></div>
    <div id="llist"></div>
    <div class="ph"><span>Adicionar</span></div>
    <div class="add" id="addmenu"></div>
  </section>

  <section class="view">
    <div class="stage"><canvas id="cv" width="540" height="960"></canvas></div>
    <div class="transport">
      <button id="bStart" title="Início">⏮</button>
      <button id="bPlay" class="primary" style="min-width:92px">▶ Tocar</button>
      <span class="tc" id="tc">0:00.00 / 0:00.00</span>
      <button id="bCut" title="Corta a camada selecionada no playhead">✂ Cortar aqui</button>
    </div>
  </section>

  <section class="panel insp"><div class="ph"><span id="ititle">Propriedades</span></div><div id="ibody"></div></section>

  <section class="panel tl">
    <div class="tlbar"><span>Timeline</span><label>Zoom <input id="zoom" type="range" min="6" max="60" value="12"></label><span id="tlhint">Arraste as barras para mover, a borda direita para mudar a duração.</span></div>
    <div class="tlscroll" id="tlscroll"><div class="tlin" id="tlin"><div class="ruler" id="ruler"></div><div id="rows"></div><div id="ph"></div></div></div>
  </section>
</div>
<div id="toast" class="toast" hidden></div>
<div id="ovl" class="overlay" hidden></div>

<script>
const DATA = __DATA__;
(function(){
"use strict";
const $=(s,e=document)=>e.querySelector(s);
const W=1080,H=1920;
const KEYS=new Set(DATA.keys);
const TYPES={video:'Vídeo',audio:'Áudio',captions:'Legendas',glass:'Vidro',title:'Título',stat:'Número',floatingWords:'Palavras flutuantes',flash:'Flash'};
const clone=o=>JSON.parse(JSON.stringify(o));
const rid=()=>'l'+Math.random().toString(36).slice(2,7);
const fmt=t=>{t=Math.max(0,t);const m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(2)};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const toast=(m,ms=3200)=>{const e=$('#toast');e.textContent=m;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,ms)};
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

/* ---------- estado ---------- */
let P=(()=>{try{const s=lsGet('klz-project-v1');if(s){const p=JSON.parse(s);if(p&&Array.isArray(p.layers))return p}}catch(e){}return clone(DATA.project)})();
let S={t:0,playing:false,sel:null,pps:12,recording:false};
const cv=$('#cv'),ctx=cv.getContext('2d');
const tmp=document.createElement('canvas'),tctx=tmp.getContext('2d');
let K=cv.width/W;
const dur=()=>P.durationSec;
const layerEnd=l=>l.start+l.duration;
function save(){lsSet('klz-project-v1',JSON.stringify(P))}
function recalcDur(){const e=Math.max(...P.layers.map(layerEnd),1);if(e>P.durationSec)P.durationSec=Math.round(e*100)/100}

/* ---------- mídia ---------- */
const media={videoUrl:null,vids:{},bufs:{},audioFiles:{}};
let actx=null,bus=null,spk=null,recDest=null,dubsReady=Promise.resolve();
function ensureAudio(){
  if(actx)return actx;
  actx=new (window.AudioContext||window.webkitAudioContext)();
  bus=actx.createGain();spk=actx.createGain();recDest=actx.createMediaStreamDestination();
  bus.connect(spk);spk.connect(actx.destination);bus.connect(recDest);
  return actx;
}
async function decode(key,arrbuf){const a=ensureAudio();media.bufs[key]=await a.decodeAudioData(arrbuf.slice(0))}
async function loadDubs(){
  for(const [k,b64] of Object.entries(DATA.wav)){
    const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    try{await decode(k,u.buffer)}catch(e){}
  }
}
function vidFor(l){
  let v=media.vids[l.id];
  if(!v||v.src!==media.videoUrl){
    if(!media.videoUrl)return null;
    v=document.createElement('video');v.src=media.videoUrl;v.playsInline=true;v.preload='auto';v.crossOrigin='anonymous';
    v._gain=null;v.style.cssText='position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:0;pointer-events:none';document.body.appendChild(v);media.vids[l.id]=v;
  }
  return v;
}
function wireVideoAudio(v,l){
  if(v._src)return;
  ensureAudio();
  v._src=actx.createMediaElementSource(v);v._gain=actx.createGain();v._src.connect(v._gain);v._gain.connect(bus);
}
/* IndexedDB: guarda o vídeo escolhido para a próxima vez */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('klz-editor',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbPut(k,v){try{const d=await idb();d.transaction('f','readwrite').objectStore('f').put(v,k)}catch(e){}}
async function idbGet(k){try{const d=await idb();return await new Promise((res,rej)=>{const q=d.transaction('f').objectStore('f').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){return null}}
function setVideoBlob(blob,name){
  if(media.videoUrl)URL.revokeObjectURL(media.videoUrl);
  for(const v of Object.values(media.vids)){try{v.pause();v.remove()}catch(e){}}
  media.videoUrl=URL.createObjectURL(blob);media.vids={};
  $('#vstat').textContent='Vídeo: '+(name||'carregado');
}

/* ---------- animação ---------- */
function sp(t,d=14,s=140,m=1){
  if(t<=0)return 0;
  const w0=Math.sqrt(s/m),z=d/(2*Math.sqrt(s*m));
  if(z<1){const wd=w0*Math.sqrt(1-z*z);return 1-Math.exp(-z*w0*t)*(Math.cos(wd*t)+(z*w0/wd)*Math.sin(wd*t))}
  return 1-Math.exp(-w0*t)*(1+w0*t);
}
const lerp=(x,a,b,c,d)=>x<=a?c:x>=b?d:c+(d-c)*(x-a)/(b-a);
const FONT=(w,px)=>`${w} ${px}px Manrope, 'DM Sans', system-ui, sans-serif`;
function rrect(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function enterOut(l,lt){return {inn:sp(lt),out:lerp(lt,l.duration-0.27,l.duration,1,0)}}

/* ---------- desenho de cada tipo ---------- */
function drawVideo(l,lt){
  const v=vidFor(l);if(!v||v.readyState<2||!v.videoWidth)return;
  let z=1;for(const p of (l.zoomPunches||[])){const a=p.at,sc0=p.scale;let q=1;
    if(lt>=a&&lt<a+.25)q=1+(sc0-1)*(lt-a)/.25;else if(lt>=a+.25&&lt<a+p.hold)q=sc0;else if(lt>=a+p.hold&&lt<a+p.hold+.3)q=sc0-(sc0-1)*(lt-a-p.hold)/.3;
    z=Math.max(z,q)}
  const sc=Math.max(W/v.videoWidth,H/v.videoHeight)*z,w=v.videoWidth*sc,h=v.videoHeight*sc;
  ctx.save();ctx.filter=`brightness(${l.brightness??1}) contrast(${l.contrast??1}) saturate(${l.saturate??1})`;
  ctx.drawImage(v,(W-w)/2,(H-h)/2,w,h);ctx.restore();
}
function drawGlass(l,lt){
  const {inn,out}=l.enter?enterOut(l,lt):{inn:1,out:1};
  const x=l.x*W,y=l.y*H,w=l.w*W,h=l.h*H,sc=.94+.06*inn;
  tmp.width=cv.width;tmp.height=cv.height;tctx.drawImage(cv,0,0);
  ctx.save();ctx.globalAlpha=clamp(out*inn,0,1);
  ctx.translate(x+w/2,y+h/2);ctx.scale(sc,sc);ctx.translate(-(x+w/2),-(y+h/2));
  rrect(x,y,w,h,l.radius);ctx.save();ctx.clip();
  ctx.setTransform(1,0,0,1,0,0);ctx.filter=`blur(${l.blur*K}px)`;ctx.drawImage(tmp,0,0);ctx.filter='none';ctx.restore();
  rrect(x,y,w,h,l.radius);ctx.fillStyle=l.tint;ctx.fill();
  ctx.lineWidth=2;ctx.strokeStyle=l.borderColor;rrect(x+1,y+1,w-2,h-2,l.radius);ctx.stroke();
  ctx.restore();
}
function drawTitle(l,lt){
  const {inn,out}=enterOut(l,lt);const cx=W/2,y=l.y*H;
  ctx.save();ctx.globalAlpha=clamp(out*inn,0,1);ctx.translate(cx,y+(1-inn)*40);ctx.scale(.9+.1*inn,.9+.1*inn);
  ctx.textAlign='center';ctx.textBaseline='top';let ty=0;
  if(l.tag){
    const fs=l.fontSize*.3;ctx.font=FONT(800,fs);const t=l.tag.toUpperCase(),tw=ctx.measureText(t).width+t.length*4;
    ctx.fillStyle='rgba(255,255,255,.12)';rrect(-tw/2-26,0,tw+52,fs+22,14);ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle='rgba(255,255,255,.35)';ctx.stroke();
    ctx.fillStyle=l.accent;ctx.textBaseline='middle';if('letterSpacing' in ctx)ctx.letterSpacing='4px';ctx.fillText(t,0,(fs+22)/2);if('letterSpacing' in ctx)ctx.letterSpacing='0px';ctx.textBaseline='top';ty=fs+22+18;
  }
  ctx.font=FONT(800,l.fontSize);ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=30*K;ctx.shadowOffsetY=6*K;
  const words=l.text.split(' '),ws=words.map(w=>ctx.measureText(w+' ').width);let tot=ws.reduce((a,b)=>a+b,0)-ctx.measureText(' ').width,x=-tot/2;
  ctx.textAlign='left';words.forEach((w,i)=>{ctx.fillStyle=(l.accentLast&&i===words.length-1)?l.accent:l.color;ctx.fillText(w,x,ty);x+=ws[i]});
  ctx.restore();
}
function drawStat(l,lt){
  const {inn,out}=enterOut(l,lt);const w=W*.62,h=330,x=(W-w)/2,y=l.y*H;
  ctx.save();ctx.globalAlpha=clamp(out*inn,0,1);ctx.translate(W/2,y+h/2);ctx.scale(.9+.1*inn,.9+.1*inn);ctx.translate(-W/2,-(y+h/2));
  ctx.fillStyle='rgba(12,12,18,.62)';rrect(x,y,w,h,34);ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,.3)';ctx.stroke();
  ctx.textBaseline='top';ctx.textAlign='left';ctx.fillStyle=l.color;ctx.globalAlpha*=.85;ctx.font=FONT(800,32);
  if('letterSpacing' in ctx)ctx.letterSpacing='3px';ctx.fillText(l.label.toUpperCase(),x+40,y+30);if('letterSpacing' in ctx)ctx.letterSpacing='0px';ctx.globalAlpha=clamp(out*inn,0,1);
  const c=lerp(lt,.2,1.4,0,l.value);ctx.fillStyle=l.accent;ctx.font=FONT(800,150);const ns=String(Math.round(c));ctx.fillText(ns,x+40,y+72);
  const nw=ctx.measureText(ns).width;ctx.font=FONT(800,60);ctx.fillText(l.suffix,x+40+nw+10,y+150);
  const bar=clamp(c/Math.max(Math.abs(l.value),1),0,1);ctx.fillStyle='rgba(255,255,255,.18)';rrect(x+40,y+h-52,w-80,16,8);ctx.fill();
  if(bar>0){ctx.fillStyle=l.accent;rrect(x+40,y+h-52,(w-80)*bar,16,8);ctx.fill()}
  ctx.restore();
}
function drawFloating(l,lt){
  const {out}=enterOut(l,lt);
  l.words.forEach((w,i)=>{
    const a=(i*137.5)%360,x=W*(.18+.64*((Math.sin(i*2.3)+1)/2)),y=H*(.06+.2*((Math.cos(i*1.7)+1)/2))+Math.sin((lt*30+i*20)/30)*8,ap=sp(lt-i*.13);
    ctx.save();ctx.globalAlpha=clamp(out*.85*ap,0,1);ctx.translate(x,y);ctx.rotate((((a%24)-12)*Math.PI)/180);ctx.scale(ap,ap);
    ctx.font=FONT(800,l.fontSize*(.8+((i*7)%5)/10));ctx.fillStyle=l.color;ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=20*K;ctx.fillText(w,0,0);ctx.restore();
  });
}
function drawFlash(l,lt){const o=lerp(lt,0,.1,0,.9);const o2=lt<.1?o:lerp(lt,.1,l.duration,.9,0);ctx.save();ctx.globalAlpha=o2;ctx.fillStyle=l.color;ctx.fillRect(0,0,W,H);ctx.restore()}
let capCache={};
function groupsOf(l){
  const c=capCache[l.id];if(c&&c.ref===l.words&&c.mc===l.maxChars&&c.mw===l.maxWords)return c.g;
  const out=[];let cur=[];
  for(const w of l.words){const ch=cur.reduce((a,x)=>a+x.text.length+1,0)+w.text.length;
    if(cur.length&&(cur.length>=l.maxWords||ch>l.maxChars||w.p!==cur[cur.length-1].p)){out.push(cur);cur=[]}cur.push(w)}
  if(cur.length)out.push(cur);
  capCache[l.id]={ref:l.words,mc:l.maxChars,mw:l.maxWords,g:out};return out;
}

let srcs=[],t0=0,tS=0,rec=null;
function stopMedia(){for(const s of srcs){try{s.stop()}catch(e){}}srcs=[];for(const v of Object.values(media.vids))try{v.pause()}catch(e){}}
function scheduleAudio(from){
  if(!actx)return;
  for(const l of P.layers){
    if(l.type!=='audio')continue;const b=media.bufs[l.src]||media.bufs[(l.src||'').split('/').pop().replace('dub_','').replace('.wav','')];if(!b)continue;
    const end=layerEnd(l);if(end<=from)continue;
    const s=actx.createBufferSource(),g=actx.createGain();s.buffer=b;s.playbackRate.value=l.rate||1;g.gain.value=l.volume??1;s.connect(g);g.connect(bus);
    const when=actx.currentTime+Math.max(0,l.start-from),off=(l.trimStart||0)+Math.max(0,from-l.start)*(l.rate||1),left=(end-Math.max(from,l.start))*(l.rate||1);
    try{s.start(when,off,left)}catch(e){}srcs.push(s);
  }
}
function syncVideos(){
  for(const l of P.layers){
    if(l.type!=='video')continue;const v=vidFor(l);if(!v)continue;wireVideoAudio(v,l);v._gain.gain.value=l.volume??1;
    const lt=S.t-l.start,active=lt>=0&&lt<l.duration,target=(l.trimStart||0)+lt;
    if(S.playing&&active){if(v.paused||Math.abs(v.currentTime-target)>.3){try{v.currentTime=target}catch(e){}v.play().catch(()=>{})}}
    else{if(!v.paused)v.pause();if(active&&Math.abs(v.currentTime-target)>.04){try{v.currentTime=target}catch(e){}}}
  }
}
function play(){
  if(S.playing)return;ensureAudio();actx.resume();

}
function pause(){if(!S.playing)return;S.playing=false;stopMedia();$('#bPlay').textContent='▶ Tocar'}
function seek(t){const was=S.playing;if(was)pause();S.t=clamp(t,0,dur());syncVideos();if(was)play();updatePH()}
function loop(){

function phrases(l){

function rewritePhrase(l,p,text){
  const old=l.words.filter(w=>w.p===p);if(!old.length)return;const s=old[0].start,e=old[old.length-1].end;

}

  spk.gain.value=0;S.recording=true;chunks=[];
  const stream=cv.captureStream(30);recDest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
  rec=new MediaRecorder(stream,{mimeType:mime||undefined,videoBitsPerSecond:res>=1080?12e6:res>=720?8e6:5e6,audioBitsPerSecond:192e3});

  S.t=0;syncVideos();await new Promise(r=>setTimeout(r,400));
  rec.start(500);play();
  const tick=()=>{if(!S.recording)return;const p=$('#pb');if(p)p.style.width=(S.t/dur()*100)+'%';requestAnimationFrame(tick)};tick();
}
function endRecordUI(){S.recording=false;spk.gain.value=1;cv.width=540;cv.height=960;$('#ovl').hidden=true}
function cancelRecord(){S.recording=false;try{rec.onstop=null;rec.stop()}catch(e){}pause();endRecordUI();toast('Exportação cancelada.')}
function finishRecord(){
  const r=rec;r.onstop=async()=>{
    endRecordUI();const ext=mime.includes('mp4')?'mp4':'webm';const blob=new Blob(chunks,{type:mime||'video/webm'});
    const d=await getDL();
    if(!d){toast('Vídeo gravado, mas salvar arquivos não está disponível neste modo de abertura.');return}
    try{await d.save({filename:'reel-en.'+ext,data:blob});toast('Vídeo salvo.')}catch(e){if(e.code!=='declined')toast('Não foi possível salvar: '+(e.message||e.code))}
  };r.stop();
}
$('#bExport').onclick=startExport;

/* ---------- inicialização ---------- */
(async function init(){
  buildAdd();renderAll();requestAnimationFrame(loop);
  try{await document.fonts.load('800 64px Manrope');await document.fonts.load('700 64px Manrope')}catch(e){}
  dubsReady=loadDubs();
  const saved=await idbGet('video');if(saved&&saved.blob){setVideoBlob(saved.blob,saved.name);}
  else $('#vstat').textContent='Abra o vídeo original para ver a imagem.';
})();
})();
</script>
